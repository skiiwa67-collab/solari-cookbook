<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SKIIWA · Next Launch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f4e6c8;
        --ink-dim: #c9b48a;
        --brass: #d4b36a;
        --flame: #ff7a2f;
        --flame-hot: #ffe7a3;
        --night: #05060c;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: var(--night);
        color: var(--ink);
        font-family: "Cormorant Garamond", Georgia, serif;
      }

      body {
        min-height: 100dvh;
        overflow: hidden;
      }

      canvas#stars {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .scene {
        position: fixed;
        inset: 0;
        z-index: 0;
      }

      .scene picture,
      .scene img.plate {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 40%;
        display: block;
      }

      .parchment {
        position: absolute;
        inset: 0;
        background: url("art/davinci-codex-sheet.jpg") center/cover;
        mix-blend-mode: multiply;
        opacity: 0.22;
        pointer-events: none;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 42%, transparent 18%, rgba(5, 6, 12, 0.35) 55%, rgba(5, 6, 12, 0.78) 100%),
          linear-gradient(180deg, rgba(5, 6, 12, 0.2) 0%, transparent 22%, transparent 58%, rgba(5, 6, 12, 0.72) 100%);
        pointer-events: none;
      }

      svg.sky {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 3;
      }

      .orbit {
        fill: none;
        stroke: #e8d7a4;
        stroke-width: 1.4;
        stroke-linecap: round;
        filter: drop-shadow(0 0 6px rgba(232, 215, 164, 0.55));
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
        animation: draw-orbit 7.5s ease-in-out infinite;
      }

      @keyframes draw-orbit {
        0% {
          stroke-dashoffset: 1400;
          opacity: 0.15;
        }
        18% {
          opacity: 0.95;
        }
        70% {
          stroke-dashoffset: 0;
          opacity: 0.85;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0.2;
        }
      }

      .geom {
        fill: none;
        stroke: rgba(212, 179, 106, 0.28);
        stroke-width: 0.7;
      }

      .chopsticks {
        transform-origin: 50% 78%;
        animation: chopsticks 6.8s ease-in-out infinite;
      }

      .chopsticks.wide {
        animation-duration: 2.4s;
      }

      @keyframes chopsticks {
        0%,
        100% {
          transform: rotate(0deg) scaleX(1);
        }
        50% {
          transform: rotate(-0.6deg) scaleX(1.035);
        }
      }

      .flame {
        position: absolute;
        left: 50%;
        bottom: 7%;
        width: min(28vw, 280px);
        height: 14vh;
        transform: translateX(-50%);
        z-index: 4;
        pointer-events: none;
      }

      .flame i {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 40%;
        height: 100%;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at 50% 100%, var(--flame-hot) 0%, var(--flame) 32%, transparent 72%);
        filter: blur(8px);
        mix-blend-mode: screen;
        animation: trench 0.55s ease-in-out infinite alternate;
      }

      .flame i:nth-child(2) {
        width: 70%;
        height: 70%;
        animation-duration: 0.4s;
        opacity: 0.7;
      }

      .flame i:nth-child(3) {
        width: 100%;
        height: 45%;
        animation-duration: 0.72s;
        opacity: 0.45;
      }

      .flame.hot i {
        animation-duration: 0.22s;
        filter: blur(6px);
      }

      @keyframes trench {
        from {
          transform: translateX(-50%) scale(0.88, 0.8);
          opacity: 0.55;
        }
        to {
          transform: translateX(-48%) scale(1.12, 1.18);
          opacity: 1;
        }
      }

      .spark {
        position: fixed;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff6d2;
        box-shadow: 0 0 8px #ffe7a3;
        pointer-events: none;
        z-index: 8;
        animation: spark 900ms ease-out forwards;
      }

      @keyframes spark {
        to {
          transform: translate(var(--dx), var(--dy)) scale(0);
          opacity: 0;
        }
      }

      .hit {
        position: absolute;
        z-index: 6;
        border: 0;
        background: transparent;
        cursor: pointer;
        border-radius: 50%;
      }

      .hit:focus-visible {
        outline: 1px dashed var(--brass);
      }

      .hit-moon {
        top: 8%;
        right: 11%;
        width: 12vw;
        height: 12vw;
      }

      .hit-arms {
        top: 22%;
        left: 42%;
        width: 16vw;
        height: 42vh;
        border-radius: 40%;
      }

      .hit-trench {
        left: 38%;
        bottom: 6%;
        width: 24vw;
        height: 16vh;
        border-radius: 40%;
      }

      .hit-orbit {
        top: 14%;
        left: 8%;
        width: 30vw;
        height: 18vh;
        border-radius: 40%;
      }

      .folio {
        position: fixed;
        z-index: 7;
        left: 3.2vw;
        bottom: 3.2vh;
        width: min(38rem, 46vw);
        padding: 1.35rem 1.5rem 1.15rem;
        background:
          linear-gradient(165deg, rgba(38, 28, 16, 0.72), rgba(12, 10, 8, 0.78)),
          url("art/davinci-codex-sheet.jpg") center/cover;
        background-blend-mode: multiply;
        border: 1px solid rgba(212, 179, 106, 0.38);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), inset 0 0 40px rgba(80, 50, 16, 0.25);
        transform: rotate(-0.6deg);
      }

      .stamp {
        display: inline-block;
        font-family: Cinzel, serif;
        font-size: 0.62rem;
        letter-spacing: 0.22em;
        color: var(--brass);
        border: 1px solid rgba(212, 179, 106, 0.55);
        padding: 0.22rem 0.55rem;
        margin-bottom: 0.7rem;
      }

      .wordmark {
        font-family: Cinzel, serif;
        font-weight: 700;
        letter-spacing: 0.34em;
        font-size: clamp(1.1rem, 2.1vw, 1.55rem);
        color: var(--brass);
      }

      .note {
        font-family: Caveat, cursive;
        color: var(--ink-dim);
        font-size: 1.2rem;
        margin: 0.15rem 0 0.55rem;
      }

      h1.mission {
        font-size: clamp(1.8rem, 3.4vw, 2.7rem);
        font-weight: 600;
        line-height: 1.05;
        color: #fff4d8;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65);
      }

      .facts {
        margin-top: 0.75rem;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.28rem 0.85rem;
        font-size: clamp(1.05rem, 1.5vw, 1.25rem);
      }

      .facts dt {
        font-family: Caveat, cursive;
        color: var(--brass);
        font-size: 1.15em;
      }

      .facts dd {
        color: #f7edd2;
      }

      .go {
        color: #ffe08a;
        letter-spacing: 0.18em;
        font-family: Cinzel, serif;
        font-size: 0.95em;
      }

      .hint {
        margin-top: 0.75rem;
        font-family: Caveat, cursive;
        font-size: 1.15rem;
        color: var(--ink-dim);
      }

      .explore {
        position: fixed;
        z-index: 9;
        right: 3.2vw;
        top: 18vh;
        width: min(22rem, 34vw);
        padding: 1rem 1.15rem;
        background: rgba(12, 10, 8, 0.72);
        border: 1px solid rgba(212, 179, 106, 0.4);
        color: var(--ink);
        transform: rotate(0.8deg);
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
      }

      .explore.show {
        opacity: 1;
        pointer-events: auto;
      }

      .explore h2 {
        font-family: Cinzel, serif;
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        color: var(--brass);
        margin-bottom: 0.4rem;
      }

      .explore p {
        font-size: 1.15rem;
        line-height: 1.35;
      }

      @media (max-width: 820px), (max-aspect-ratio: 3/4) {
        body {
          overflow: auto;
        }

        .folio {
          left: 4vw;
          right: 4vw;
          width: auto;
          bottom: 2vh;
          transform: none;
        }

        .explore {
          top: auto;
          bottom: 34vh;
          right: 4vw;
          width: auto;
          left: 4vw;
        }

        .hit-moon {
          width: 22vw;
          height: 22vw;
        }
        .hit-arms {
          left: 28%;
          width: 44vw;
        }
        .hit-trench {
          left: 22%;
          width: 56vw;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .orbit,
        .chopsticks,
        .flame i {
          animation: none;
        }
        .orbit {
          stroke-dashoffset: 0;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body class="is-sample">
    <div class="scene" aria-hidden="true">
      <picture>
        <source media="(max-aspect-ratio: 3/4)" srcset="art/night-pad-9x16.jpg" />
        <img class="plate" src="art/night-pad-16x9.jpg" alt="" />
      </picture>
      <div class="parchment"></div>
      <div class="vignette"></div>
      <div class="flame" id="flame" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <canvas id="stars"></canvas>

    <svg class="sky" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <circle class="geom" cx="1280" cy="160" r="90" />
      <circle class="geom" cx="1280" cy="160" r="128" />
      <circle class="geom" cx="800" cy="820" r="210" />
      <path class="geom" d="M80 640 C 420 220, 980 140, 1480 280" />
      <path
        id="orbitPath"
        class="orbit"
        d="M 120 620 C 360 210, 920 80, 1420 240"
      />
      <g class="chopsticks" id="chopsticks">
        <path
          d="M 760 780 L 790 240 L 808 236 L 792 780 Z"
          fill="rgba(212,179,106,0.16)"
          stroke="rgba(232,215,164,0.45)"
          stroke-width="1.2"
        />
        <path
          d="M 840 780 L 808 236 L 828 232 L 870 780 Z"
          fill="rgba(212,179,106,0.16)"
          stroke="rgba(232,215,164,0.45)"
          stroke-width="1.2"
        />
      </g>
    </svg>

    <button class="hit hit-moon" data-study="moon" aria-label="Study the moon"></button>
    <button class="hit hit-arms" data-study="chopsticks" aria-label="Study the chopsticks"></button>
    <button class="hit hit-trench" data-study="trench" aria-label="Study the flame trench"></button>
    <button class="hit hit-orbit" data-study="orbit" aria-label="Study the orbital path"></button>

    <aside class="folio">
      <div class="stamp">SAMPLE · NOT LIVE · next-launch.sample.json</div>
      <div class="wordmark">SKIIWA</div>
      <p class="note">A night study of the next fire.</p>
      <h1 class="mission" data-field="mission">Starlink Group 15-23</h1>
      <dl class="facts">
        <dt>vehicle</dt>
        <dd data-field="vehicle">Falcon 9 Block 5</dd>
        <dt>pad</dt>
        <dd data-field="pad">SLC-4E Vandenberg 4E</dd>
        <dt>NET</dt>
        <dd data-field="net">2026-09-02 07:46 UTC</dd>
        <dt>status</dt>
        <dd class="go" data-field="status">GO</dd>
        <dt>source</dt>
        <dd data-field="sources">Launch Library 2</dd>
      </dl>
      <p class="hint">Touch the arms · the trench · the moon · the path</p>
    </aside>

    <aside class="explore" id="explore" hidden>
      <h2 id="explore-k">Study</h2>
      <p id="explore-p"></p>
    </aside>

    <script>
      const SAMPLE_FACTS = {
        dataKind: "SAMPLE",
        sample: true,
        filename: "next-launch.sample.json",
        status: "GO",
        net: "2026-09-02 07:46 UTC",
        mission: "Starlink Group 15-23",
        vehicle: "Falcon 9 Block 5",
        pad: "SLC-4E Vandenberg 4E",
        sources: ["Launch Library 2"],
      };

      const NOTES = {
        moon: {
          k: "LUNA",
          p: "The moon is a clock. A vehicle leaving 4E must rise into a plane the night already drew.",
        },
        chopsticks: {
          k: "THE ARMS",
          p: "Two levers, one catch. The chopsticks open like a compass — geometry before fire.",
        },
        trench: {
          k: "THE TRENCH",
          p: "Flame is led into the earth so the vehicle may leave it. A study of heat, not a widget.",
        },
        orbit: {
          k: "THE PATH",
          p: "An orbit is not a guess. It is a line that must be drawn — then flown.",
        },
      };

      function isSample(data) {
        return !data || data.sample === true || data.dataKind === "SAMPLE";
      }

      function displayValue(key, raw) {
        if (key === "sources") {
          const list = Array.isArray(raw) ? raw.filter(Boolean) : raw ? [raw] : [];
          return list.length ? list.join(" · ") : "";
        }
        return raw == null ? "" : String(raw).trim();
      }

      function fill(data) {
        const src = data && typeof data === "object" ? data : SAMPLE_FACTS;
        document.body.classList.toggle("is-sample", isSample(src));
        for (const key of ["status", "net", "mission", "vehicle", "pad", "sources"]) {
          const el = document.querySelector('[data-field="' + key + '"]');
          const text = displayValue(key, src[key]) || displayValue(key, SAMPLE_FACTS[key]);
          if (el && text) el.textContent = text;
        }
      }

      fill(SAMPLE_FACTS);

      async function load() {
        try {
          const live = await fetch(new URL("next-launch.json", document.baseURI), { cache: "no-store" });
          if (live.ok) {
            const data = await live.json();
            if (!isSample(data)) {
              fill(data);
              return;
            }
          }
        } catch (_) {}
        try {
          const sample = await fetch(new URL("next-launch.sample.json", document.baseURI) + "?v=codex", {
            cache: "no-store",
          });
          if (sample.ok) fill(await sample.json());
        } catch (_) {}
      }

      load();

      const stars = document.getElementById("stars");
      const sctx = stars.getContext("2d");
      let field = [];

      function resizeStars() {
        stars.width = innerWidth;
        stars.height = innerHeight;
        field = Array.from({ length: 160 }, () => ({
          x: Math.random() * stars.width,
          y: Math.random() * stars.height * 0.72,
          r: Math.random() * 1.4 + 0.2,
          p: Math.random() * Math.PI * 2,
        }));
      }

      function drawStars(t) {
        sctx.clearRect(0, 0, stars.width, stars.height);
        for (const st of field) {
          const a = 0.35 + 0.65 * Math.abs(Math.sin(t / 700 + st.p));
          sctx.fillStyle = "rgba(255,246,210," + a + ")";
          sctx.beginPath();
          sctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
          sctx.fill();
        }
        requestAnimationFrame(drawStars);
      }

      resizeStars();
      addEventListener("resize", resizeStars);
      requestAnimationFrame(drawStars);

      function sparkle(x, y, n) {
        for (let i = 0; i < n; i++) {
          const el = document.createElement("i");
          el.className = "spark";
          const ang = Math.random() * Math.PI * 2;
          const dist = 18 + Math.random() * 70;
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.setProperty("--dx", Math.cos(ang) * dist + "px");
          el.style.setProperty("--dy", Math.sin(ang) * dist + "px");
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 920);
        }
      }

      document.addEventListener("click", (e) => sparkle(e.clientX, e.clientY, 14));

      const explore = document.getElementById("explore");
      const chopsticks = document.getElementById("chopsticks");
      const flame = document.getElementById("flame");
      const orbit = document.getElementById("orbitPath");

      function showStudy(key) {
        const note = NOTES[key];
        if (!note) return;
        document.getElementById("explore-k").textContent = note.k;
        document.getElementById("explore-p").textContent = note.p;
        explore.hidden = false;
        explore.classList.add("show");
        chopsticks.classList.toggle("wide", key === "chopsticks");
        flame.classList.toggle("hot", key === "trench");
        if (key === "orbit") {
          orbit.style.animation = "none";
          void orbit.getBoundingClientRect();
          orbit.style.animation = "";
        }
      }

      document.querySelectorAll("[data-study]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          sparkle(e.clientX, e.clientY, 22);
          showStudy(btn.dataset.study);
        });
      });

      document.querySelector(".folio").addEventListener("click", (e) => {
        sparkle(e.clientX, e.clientY, 10);
        showStudy("orbit");
      });
    </script>
  </body>
</html>
