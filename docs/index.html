<!DOCTYPE html>
<!--
  OVERLAY LOCK (Darren): stills are FRAMES. Do not edit the three PNGs.
  Hero: solari-davinci-pad-16x9.png / solari-davinci-pad-9x16.png
  Codex: solari-davinci-codex-16x9.png — click-to-find only.
  Chopsticks motion lives on Codex / arms hotspot. Do not draw Mechazilla on 4E.
  SAMPLE Starlink 15-23 / F9 · 4E stays on the art. Extra LL2 facts are SAMPLE forever.
  No six-field Inter grid. No LRT HUD. No invented numbers.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SKIIWA · Next Launch</title>
    <style>
      :root {
        --night: #05060a;
        --brass: #c4a36a;
        --ink: #f4e6c8;
        --flame: #ff7a2f;
        --hot: #ffe7a3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: var(--night);
        color: var(--ink);
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      .sample-banner {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 12;
        background: rgba(10, 10, 12, 0.72);
        color: var(--brass);
        text-align: center;
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 0.4rem 0.8rem;
      }

      body.is-sample .sample-banner {
        display: block;
      }

      .board {
        position: fixed;
        inset: 0;
        z-index: 1;
      }

      .hero,
      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .hero img {
        object-fit: cover;
        object-position: center;
        display: none;
      }

      .hero img.show {
        display: block;
      }

      canvas#stars,
      canvas#embers {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      canvas#stars {
        z-index: 2;
        mix-blend-mode: screen;
        opacity: 0.95;
      }

      canvas#embers {
        z-index: 5;
        mix-blend-mode: screen;
      }

      svg.draw {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
      }

      .orbit {
        fill: none;
        stroke: #ffe7a3;
        stroke-width: 2.2;
        stroke-linecap: round;
        filter: drop-shadow(0 0 10px rgba(255, 140, 40, 0.75));
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        animation: draw-orbit 6.5s ease-in-out infinite;
      }

      .orbit.late {
        animation-delay: 1.1s;
        stroke-width: 1.3;
        opacity: 0.75;
      }

      .geom {
        fill: none;
        stroke: rgba(196, 163, 106, 0.22);
        stroke-width: 0.7;
      }

      .ship {
        fill: #fff6d2;
        filter: drop-shadow(0 0 8px #ff9a3c);
        offset-path: path("M 110 610 C 380 200, 940 70, 1480 230");
        offset-distance: 0%;
        animation: fly 6.5s ease-in-out infinite;
      }

      @keyframes draw-orbit {
        0% {
          stroke-dashoffset: 1800;
          opacity: 0.15;
        }
        14% {
          opacity: 1;
        }
        72% {
          stroke-dashoffset: 0;
          opacity: 0.9;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0.2;
        }
      }

      @keyframes fly {
        0% {
          offset-distance: 0%;
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        78% {
          offset-distance: 100%;
          opacity: 1;
        }
        100% {
          offset-distance: 100%;
          opacity: 0;
        }
      }

      body.find-arcs .orbit {
        animation: draw-orbit 2.8s ease-in-out 1;
        stroke: #fff1c4;
      }

      .trench {
        position: absolute;
        left: 50%;
        bottom: 5%;
        width: min(48vw, 560px);
        height: 22vh;
        transform: translateX(-50%);
        z-index: 4;
        pointer-events: none;
        mix-blend-mode: screen;
      }

      .trench i {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 46%;
        height: 100%;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at 50% 100%, var(--hot) 0%, var(--flame) 28%, transparent 70%);
        filter: blur(11px);
        animation: trench 0.42s ease-in-out infinite alternate;
      }

      .trench i:nth-child(2) {
        width: 78%;
        height: 72%;
        animation-duration: 0.3s;
        opacity: 0.8;
      }

      .trench i:nth-child(3) {
        width: 110%;
        height: 48%;
        animation-duration: 0.58s;
        opacity: 0.5;
      }

      .trench i:nth-child(4) {
        width: 28%;
        height: 120%;
        background: radial-gradient(ellipse at 50% 80%, #fff 0%, #ffd080 30%, transparent 68%);
        animation-duration: 0.22s;
        opacity: 0.85;
      }

      body.find-trench .trench i {
        animation-duration: 0.14s;
        filter: blur(6px);
      }

      @keyframes trench {
        from {
          transform: translateX(-50%) scale(0.82, 0.74);
          opacity: 0.55;
        }
        to {
          transform: translateX(-46%) scale(1.18, 1.28);
          opacity: 1;
        }
      }

      .spark {
        position: fixed;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff6d2;
        box-shadow: 0 0 8px #ffe7a3;
        pointer-events: none;
        z-index: 10;
        animation: spark 880ms ease-out forwards;
      }

      @keyframes spark {
        to {
          transform: translate(var(--dx), var(--dy)) scale(0);
          opacity: 0;
        }
      }

      .hit {
        position: absolute;
        z-index: 6;
        border: 0;
        background: transparent;
        cursor: pointer;
        border-radius: 50%;
      }

      .hit:focus-visible {
        outline: 1px dashed var(--brass);
      }

      body.find-moon .hit-moon,
      body.find-arcs .hit-arcs,
      body.find-arms .hit-arms,
      body.find-trench .hit-trench,
      body.find-brand .hit-brand {
        box-shadow: inset 0 0 0 1px rgba(212, 179, 106, 0.7), 0 0 28px rgba(212, 179, 106, 0.28);
      }

      .hit-brand {
        top: 3%;
        left: 2%;
        width: 16vw;
        height: 8vh;
        border-radius: 8px;
      }

      .hit-moon {
        top: 6%;
        left: 6%;
        width: 13vw;
        height: 13vw;
      }

      .hit-arcs {
        top: 8%;
        left: 28%;
        width: 38vw;
        height: 22vh;
        border-radius: 42%;
      }

      .hit-arms {
        top: 22%;
        left: 34%;
        width: 32vw;
        height: 48vh;
        border-radius: 42%;
      }

      .hit-trench {
        left: 28%;
        bottom: 8%;
        width: 44vw;
        height: 22vh;
        border-radius: 40%;
      }

      .bar {
        position: absolute;
        z-index: 8;
        left: 50%;
        bottom: 1.4vh;
        transform: translateX(-50%);
        display: flex;
        gap: 0.35rem;
        padding: 0.28rem 0.45rem;
        border: 1px solid rgba(196, 163, 106, 0.38);
        background: rgba(8, 8, 10, 0.42);
        backdrop-filter: blur(6px);
      }

      .bar button {
        width: 2.1rem;
        height: 1.7rem;
        border: 0;
        background: transparent;
        color: var(--brass);
        cursor: pointer;
      }

      .bar button svg {
        width: 100%;
        height: 100%;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.4;
      }

      .bar button:focus-visible,
      .bar button:hover {
        color: #fff1c4;
      }

      #codex {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        background: #1a140c;
        cursor: pointer;
        overflow: hidden;
      }

      #codex.show {
        display: block;
      }

      #codex img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #codex.show img {
        animation: codex-breathe 7s ease-in-out infinite;
      }

      .codex-arms {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .chop {
        fill: rgba(212, 179, 106, 0.12);
        stroke: rgba(255, 226, 160, 0.65);
        stroke-width: 2;
        transform-box: fill-box;
        transform-origin: 70% 80%;
        animation: chopsticks 2.8s ease-in-out infinite;
      }

      .chop.b {
        transform-origin: 30% 80%;
        animation-delay: 0.35s;
      }

      @keyframes chopsticks {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-1.4deg);
        }
      }

      @keyframes codex-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.012);
        }
      }

      @media (max-aspect-ratio: 3/4), (max-width: 720px) {
        .hit-brand {
          width: 42vw;
          height: 7vh;
        }
        .hit-moon {
          left: auto;
          right: 4%;
          width: 22vw;
          height: 22vw;
        }
        .hit-arcs {
          left: 4%;
          width: 44vw;
          height: 16vh;
        }
        .hit-arms {
          left: 16%;
          width: 68vw;
          height: 52vh;
        }
        .hit-trench {
          left: 10%;
          width: 80vw;
          bottom: 10%;
        }
        .trench {
          width: 86vw;
          bottom: 7%;
          height: 20vh;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .orbit,
        .ship,
        .trench i,
        .chop,
        #codex.show img {
          animation: none;
        }
        .orbit {
          stroke-dashoffset: 0;
          opacity: 0.65;
        }
      }
    </style>
  </head>
  <body class="is-sample">
    <div class="sample-banner" id="sample-banner">
      SAMPLE · Launch Library 2 · not live Solari
    </div>

    <main class="board" id="board">
      <div class="hero" aria-hidden="true">
        <img id="wide" src="./solari-davinci-pad-16x9.png" alt="" />
        <img id="phone" src="./solari-davinci-pad-9x16.png" alt="" />
      </div>

      <canvas id="stars"></canvas>

      <svg class="draw" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <circle class="geom" cx="220" cy="140" r="70" />
        <circle class="geom" cx="220" cy="140" r="108" />
        <path class="geom" d="M80 640 C 420 210, 980 120, 1520 260" />
        <path id="orbitA" class="orbit" d="M 110 610 C 380 200, 940 70, 1480 230" />
        <path id="orbitB" class="orbit late" d="M 160 670 C 520 280, 1040 140, 1500 300" />
        <circle class="ship" r="5" cx="0" cy="0"></circle>
      </svg>

      <div class="trench" id="trench" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <canvas id="embers"></canvas>

      <button class="hit hit-brand" data-find="brand" aria-label="SKIIWA"></button>
      <button class="hit hit-moon" data-find="moon" aria-label="Moon"></button>
      <button class="hit hit-arcs" data-find="arcs" aria-label="Trajectory"></button>
      <button class="hit hit-arms" data-find="arms" aria-label="Arms"></button>
      <button class="hit hit-trench" data-find="trench" aria-label="Flame trench"></button>

      <nav class="bar" id="bar" aria-label="Da Vinci bar">
        <button type="button" data-find="moon" aria-label="Moon study">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="10" /></svg>
        </button>
        <button type="button" data-find="arcs" aria-label="Orbital arcs">
          <svg viewBox="0 0 24 24"><path d="M3 18 C 8 6, 16 4, 21 10" /></svg>
        </button>
        <button type="button" data-find="trench" aria-label="Flame trench">
          <svg viewBox="0 0 24 24"><path d="M8 20c0-6 4-10 4-14 3 4 4 8 4 14z" /></svg>
        </button>
        <button type="button" data-find="arms" aria-label="Arms">
          <svg viewBox="0 0 24 24"><path d="M8 20 L11 4 L13 4 L12 20" /><path d="M16 20 L13 4 L15 4 L18 20" /></svg>
        </button>
        <button type="button" data-open="codex" aria-label="Open Codex">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" /><path d="M8 9h8M8 12h6" /></svg>
        </button>
      </nav>
    </main>

    <div id="codex">
      <img src="./solari-davinci-codex-16x9.png" alt="Da Vinci Codex" />
      <svg class="codex-arms" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <path class="chop" d="M 980 780 L 420 250 L 470 230 L 1040 780 Z" />
        <path class="chop b" d="M 1080 780 L 1380 210 L 1440 230 L 1160 780 Z" />
      </svg>
    </div>

    <script>
      const SAMPLE = "./next-launch.sample.json?v=motion";
      const LIVE = "./next-launch.json";

      function isSample(data) {
        return !!(data && data.sample === true);
      }

      function banner(data) {
        const sample = isSample(data);
        document.body.classList.toggle("is-sample", sample);
        const el = document.getElementById("sample-banner");
        if (!sample) {
          el.textContent = "";
          return;
        }
        const file = data.filename || "next-launch.sample.json";
        el.textContent = "SAMPLE · Launch Library 2 · not live Solari · " + file;
      }

      async function load() {
        try {
          const live = await fetch(LIVE, { cache: "no-store" });
          if (live.ok) {
            const data = await live.json();
            if (!isSample(data)) {
              banner(data);
              return;
            }
          }
        } catch (_) {}
        try {
          const sample = await fetch(SAMPLE, { cache: "no-store" });
          if (sample.ok) banner(await sample.json());
        } catch (_) {}
      }

      load();

      const wide = document.getElementById("wide");
      const phone = document.getElementById("phone");
      function layout() {
        const portrait = innerHeight > innerWidth * 1.05;
        wide.classList.toggle("show", !portrait);
        phone.classList.toggle("show", portrait);
      }
      layout();
      addEventListener("resize", layout);

      const stars = document.getElementById("stars");
      const sctx = stars.getContext("2d");
      const embers = document.getElementById("embers");
      const ectx = embers.getContext("2d");
      let field = [];
      let ash = [];

      function resizeFX() {
        stars.width = embers.width = innerWidth;
        stars.height = embers.height = innerHeight;
        field = Array.from({ length: 220 }, () => ({
          x: Math.random() * stars.width,
          y: Math.random() * stars.height * 0.72,
          r: Math.random() * 1.6 + 0.15,
          p: Math.random() * Math.PI * 2,
          flare: Math.random() < 0.08,
        }));
        ash = Array.from({ length: 70 }, () => ({
          x: innerWidth * 0.5 + (Math.random() - 0.5) * innerWidth * 0.28,
          y: innerHeight * (0.78 + Math.random() * 0.16),
          v: 0.6 + Math.random() * 1.8,
          s: 1 + Math.random() * 2.2,
          a: 0.35 + Math.random() * 0.55,
        }));
      }

      function drawStars(t) {
        sctx.clearRect(0, 0, stars.width, stars.height);
        for (const st of field) {
          const a = 0.22 + 0.78 * Math.abs(Math.sin(t / 640 + st.p));
          sctx.fillStyle = "rgba(255,246,210," + a + ")";
          sctx.beginPath();
          sctx.arc(st.x, st.y, st.flare ? st.r * (1.2 + a) : st.r, 0, Math.PI * 2);
          sctx.fill();
        }

        ectx.clearRect(0, 0, embers.width, embers.height);
        for (const p of ash) {
          p.y -= p.v;
          p.x += Math.sin(t / 200 + p.y) * 0.35;
          p.a -= 0.004;
          if (p.y < innerHeight * 0.45 || p.a <= 0) {
            p.x = innerWidth * 0.5 + (Math.random() - 0.5) * innerWidth * 0.28;
            p.y = innerHeight * 0.9;
            p.a = 0.45 + Math.random() * 0.5;
          }
          ectx.fillStyle = "rgba(255,170,70," + p.a + ")";
          ectx.beginPath();
          ectx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
          ectx.fill();
        }
        requestAnimationFrame(drawStars);
      }

      resizeFX();
      addEventListener("resize", resizeFX);
      requestAnimationFrame(drawStars);

      function sparkle(x, y, n) {
        for (let i = 0; i < n; i++) {
          const el = document.createElement("i");
          el.className = "spark";
          const ang = Math.random() * Math.PI * 2;
          const dist = 16 + Math.random() * 72;
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.setProperty("--dx", Math.cos(ang) * dist + "px");
          el.style.setProperty("--dy", Math.sin(ang) * dist + "px");
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 900);
        }
      }

      setInterval(() => {
        if (document.hidden) return;
        sparkle(40 + Math.random() * (innerWidth - 80), 30 + Math.random() * innerHeight * 0.45, 4);
      }, 1200);

      const codex = document.getElementById("codex");
      function openCodex() {
        codex.classList.add("show");
      }
      function closeCodex() {
        codex.classList.remove("show");
      }
      codex.addEventListener("click", closeCodex);

      function find(key, x, y, openCodexOnArms) {
        for (const c of [...document.body.classList]) {
          if (c.startsWith("find-")) document.body.classList.remove(c);
        }
        document.body.classList.add("find-" + key);
        sparkle(x, y, 22);
        if (key === "arcs") {
          for (const id of ["orbitA", "orbitB"]) {
            const p = document.getElementById(id);
            p.style.animation = "none";
            void p.getBoundingClientRect();
            p.style.animation = "";
          }
        }
        if (key === "arms" && openCodexOnArms !== false) openCodex();
      }

      document.querySelectorAll("[data-find]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          find(el.dataset.find, e.clientX, e.clientY);
        });
      });

      document.querySelectorAll("[data-open='codex']").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          sparkle(e.clientX, e.clientY, 18);
          openCodex();
        });
      });

      document.getElementById("board").addEventListener("click", (e) => {
        if (codex.classList.contains("show")) return;
        const hits = [
          { key: "moon", el: document.querySelector(".hit-moon") },
          { key: "arcs", el: document.querySelector(".hit-arcs") },
          { key: "arms", el: document.querySelector(".hit-arms") },
          { key: "trench", el: document.querySelector(".hit-trench") },
          { key: "brand", el: document.querySelector(".hit-brand") },
        ];
        let best = hits[0];
        let bestD = Infinity;
        for (const h of hits) {
          const r = h.el.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          const d = (e.clientX - cx) ** 2 + (e.clientY - cy) ** 2;
          if (d < bestD) {
            bestD = d;
            best = h;
          }
        }
        find(best.key, e.clientX, e.clientY, false);
      });
    </script>
  </body>
</html>
