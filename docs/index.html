<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SKIIWA · Next Launch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #05060a; overflow: hidden; }
    .board { position: fixed; inset: 0; }
    .board img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: none; }
    .board img.show { display: block; }
    #codex { position: fixed; inset: 0; display: none; z-index: 2; background: #1a140c; }
    #codex.show { display: block; }
    #codex img { width: 100%; height: 100%; object-fit: contain; background: #1a140c; }
    button.hit { position: absolute; opacity: 0; cursor: pointer; border: 0; background: transparent; }
  </style>
</head>
<body>
  <div class="board" id="hero">
    <img id="wide" src="./solari-davinci-pad-16x9.png" alt="SKIIWA next launch" />
    <img id="phone" src="./solari-davinci-pad-9x16.png" alt="SKIIWA next launch" />
  </div>
  <div id="codex"><img src="./solari-davinci-codex-16x9.png" alt="Codex" /></div>
  <script>
    const wide = document.getElementById("wide");
    const phone = document.getElementById("phone");
    const codex = document.getElementById("codex");
    function layout() {
      const portrait = window.innerHeight > window.innerWidth * 1.05;
      wide.classList.toggle("show", !portrait);
      phone.classList.toggle("show", portrait);
    }
    layout();
    window.addEventListener("resize", layout);
    document.getElementById("hero").addEventListener("click", () => {
      if (codex.classList.contains("show")) return;
      codex.classList.add("show");
    });
    codex.addEventListener("click", () => codex.classList.remove("show"));
  </script>
</body>
</html>
